<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - Smart Repellent System</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <style>
        body {
            margin: 0;
            background: #f4f6f9;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .register-box {
            background: white;
            border-radius: 12px;
            padding: 3rem;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            text-align: center;
        }

        .register-box img {
            width: 280px;
            height: auto;
            margin-bottom: 1rem;
        }

        h2 {
            background: linear-gradient(to right, #6a00f4, #c400ff, #ff0080, #ff8c00, #ffe600);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
        }

        input {
            width: 100%;
            padding: 0.8rem;
            margin: 0.5rem 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 0.8rem;
            margin-top: 1rem;
            background: linear-gradient(to right, #6a00f4, #ff0080, #ffe600);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
        }

        .error {
            color: red;
            font-size: 0.9rem;
            text-align: center;
            margin-top: 0.5rem;
        }

        .footer {
            text-align: center;
            font-size: 0.85rem;
            margin-top: 1.5rem;
        }

        .footer a {
            color: #6a00f4;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="register-box">
        <img src="images/register.png" alt="Register Icon">
        <h2>Create Account</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <input type="password" id="confirmPassword" placeholder="Confirm Password">
        <button onclick="register()">Register</button>
        <div class="error" id="error"></div>
        <div class="footer">
            Already have an account? <a href="login.html">Login here</a>
        </div>
    </div>

    <script>

        function register() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const errorBox = document.getElementById("error");

            if (password !== confirmPassword) {
                errorBox.textContent = "Passwords do not match.";
                return;
            }

            firebase.auth().createUserWithEmailAndPassword(email, password)
                .then(() => {
                    alert("Registration successful. Please log in.");
                    window.location.href = "login.html";
                })
                .catch(error => {
                    errorBox.textContent = error.message;
                });
        }
    </script>
</body>

</html>
